apiVersion: 1
datasources:
  - name: Postgres
    # referenced by total-dashboard.json
    uid: P44368ADAD746BC27
    type: grafana-postgresql-datasource
    isDefault: true
    editable: true
    url: db:5432
    user: $DB_USER
    secureJsonData:
      password: $DB_PASSWORD
    jsonData:
      database: $DB_NAME
      sslmode: 'disable'
      postgresVersion: 1700
